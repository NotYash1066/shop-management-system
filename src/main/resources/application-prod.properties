# Production profile - activated via --spring.profiles.active=prod
# Railway injects DATABASE_URL and REDIS_URL automatically

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop_management_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis

# JWT - MUST be overridden in production
app.jwtSecret=${APP_JWT_SECRET:changeme_in_production_use_openssl_rand_base64_64}
app.jwtExpirationMs=86400000

# CORS - set to your Vercel frontend URL in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Connection pool tuning for Railway
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# Async
app.async.stock-reconciliation.core-pool-size=${ASYNC_STOCK_CORE_POOL_SIZE:2}
app.async.stock-reconciliation.max-pool-size=${ASYNC_STOCK_MAX_POOL_SIZE:4}
app.async.stock-reconciliation.queue-capacity=${ASYNC_STOCK_QUEUE_CAPACITY:50}

spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
