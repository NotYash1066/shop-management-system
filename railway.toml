[phases.setup]
nixPkgs = ["jdk21"]

[phases.build]
cmds = ["./mvnw clean package -DskipTests"]

[start]
cmd = "java -jar target/*.jar"

[deploy]
healthcheckPath = "/api/test"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[variables]
SPRING_PROFILES_ACTIVE = "prod"
